<div class="chat-widget-container">
  
  <!-- Chat Window -->
  <div class="chat-window card bg-glass shadow-lg border-primary rounded-4" *ngIf="isOpen">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center p-3 border-0 rounded-top-4">
      <div class="d-flex align-items-center">
        <i class="bi bi-robot fs-4 me-2"></i>
        <h6 class="mb-0 fw-bold">InfraBot</h6>
      </div>
      <button class="btn btn-sm btn-link text-white p-0" (click)="toggleChat()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="card-body p-3 chat-body bg-dark-soft" #chatBody>
      <div *ngFor="let msg of messages" class="mb-3 d-flex" [ngClass]="{'justify-content-end': msg.sender === 'user'}">
        <div class="message-bubble p-3 rounded-4 shadow-sm"
             [ngClass]="msg.sender === 'user' ? 'bg-primary text-white user-msg' : 'bg-secondary text-light bot-msg'">
          {{ msg.text }}
        </div>
      </div>
      <div *ngIf="loading" class="mb-3 d-flex justify-content-start">
        <div class="message-bubble p-3 rounded-4 bg-secondary text-light bot-msg">
          <span class="spinner-grow spinner-grow-sm me-1" role="status"></span>
          <span class="spinner-grow spinner-grow-sm me-1" role="status"></span>
          <span class="spinner-grow spinner-grow-sm" role="status"></span>
        </div>
      </div>
    </div>

    <div class="card-footer bg-transparent border-top border-secondary p-3">
      <div class="input-group">
        <input type="text" class="form-control bg-dark text-white border-secondary custom-input" 
               placeholder="Escribe tu pregunta..." 
               [(ngModel)]="userInput" 
               (keyup.enter)="sendMessage()">
        <button class="btn btn-primary btn-glow" type="button" (click)="sendMessage()" [disabled]="loading || !userInput.trim()">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Button -->
  <button class="btn btn-primary rounded-circle shadow-lg chat-btn btn-glow d-flex align-items-center justify-content-center" 
          (click)="toggleChat()" 
          [class.pulse]="!isOpen">
    <i class="bi" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-chat-dots-fill'"></i>
  </button>

</div>
