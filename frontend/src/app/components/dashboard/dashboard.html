<div class="dashboard-wrapper">
  
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-robot fs-2 text-primary"></i>
      <h3 class="ms-2 mb-0 fw-bold text-light">InfraHelp AI</h3>
    </div>
    
    <div class="admin-profile mt-4 mb-4">
      <div class="profile-avatar bg-dark border border-secondary text-white overflow-hidden shadow-sm" style="min-width: 48px;">
        <img *ngIf="profile.avatar" [src]="profile.avatar" alt="Avatar" class="w-100 h-100 object-fit-cover">
        <i *ngIf="!profile.avatar" class="bi bi-person-fill fs-2"></i>
      </div>
      <div class="profile-info ms-3 overflow-hidden">
        <h6 class="mb-0 text-light fw-bold text-truncate">{{ profile.name }}</h6>
        <span class="badge bg-success-soft text-success mt-1"><i class="bi bi-circle-fill" style="font-size: 6px; margin-right: 4px; vertical-align: middle;"></i> Online</span>
      </div>
    </div>

    <ul class="nav flex-column sidebar-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard/home" routerLinkActive="active"><i class="bi bi-house-door"></i> Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard/model" routerLinkActive="active"><i class="bi bi-cpu"></i> Modelo IA</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard/history" routerLinkActive="active"><i class="bi bi-clock-history"></i> Historial de Tickets</a>
      </li>
      <li class="nav-item mt-2 pt-2 border-top border-secondary">
        <a class="nav-link" routerLink="/dashboard/profile" routerLinkActive="active"><i class="bi bi-person-badge"></i> Perfil Administrador</a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button class="btn btn-outline-danger w-100 rounded-3 text-start btn-logout" (click)="logout()">
        <i class="bi bi-box-arrow-left me-2"></i> Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content position-relative">
    <!-- Topbar General -->
    <header class="topbar d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <h4 class="mb-0 text-light fw-bold">Panel de Control de Infraestructura</h4>
      <div class="d-none d-md-flex gap-2">
         <span class="badge rounded-pill tech-badge"><i class="bi bi-lightning-fill text-warning"></i> FastAPI</span>
         <span class="badge rounded-pill tech-badge"><i class="bi bi-shield-shaded text-danger"></i> Angular Router</span>
      </div>
    </header>

    <!-- Inner Views -->
    <router-outlet></router-outlet>
    
    <!-- Chatbot Assistant Widget -->
    <app-chat></app-chat>
    
  </main>
</div>
